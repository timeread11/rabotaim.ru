name: Build RuStore Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK & AAB for RuStore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "./android-app/gradlew" ]; then
            chmod +x ./android-app/gradlew
          elif [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Prepare Release Keystore
        run: |
          cd android-app
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "Decoded keystore from GitHub Secret."
          elif [ -f "release.keystore" ]; then
            echo "Using pre-packaged release.keystore."
          fi

      - name: Build Signed Release APK & AAB
        run: |
          cd android-app
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RuStore-Signed-APK
          path: android-app/app/build/outputs/apk/release/app-release.apk

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: RuStore-Signed-AAB
          path: android-app/app/build/outputs/bundle/release/app-release.aab

      - name: Upload RuStore Icon (512x512)
        uses: actions/upload-artifact@v4
        with:
          name: RuStore-Icon-512
          path: android-app/rustore_icon_512.png
