name: Build RuStore Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK & AAB for RuStore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Release Keystore
        run: |
          if [ -d "android-app" ]; then cd android-app; fi
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "Decoded keystore from GitHub Secret."
          elif [ -f "release.keystore" ]; then
            echo "Using pre-packaged release.keystore."
          fi
          if [ -f "release.keystore" ]; then
            cp release.keystore app/release.keystore 2>/dev/null || true
          fi

      - name: Build Signed Release APK & AAB
        run: |
          if [ -d "android-app" ]; then cd android-app; fi
          if [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease bundleRelease --stacktrace --info
          else
            gradle wrapper
            chmod +x ./gradlew
            ./gradlew assembleRelease bundleRelease --stacktrace --info
          fi

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RuStore-Signed-APK
          path: |
            android-app/app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: RuStore-Signed-AAB
          path: |
            android-app/app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/app-release.aab

      - name: Upload RuStore Icon (512x512)
        uses: actions/upload-artifact@v4
        with:
          name: RuStore-Icon-512
          path: |
            android-app/rustore_icon_512.png
            rustore_icon_512.png
